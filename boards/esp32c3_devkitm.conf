# ESP32-C3 DevKitM

# Console goes to USB-Serial/JTAG via zephyr,console = &usb_serial in overlay
# (ESP_CONSOLE_USB_SERIAL_JTAG is auto-detected from device tree)

# Disable features not available on ESP32-C3 DevKitM
CONFIG_APP_HTTPS=n
CONFIG_RTC=n

# GPIO features
CONFIG_CONSOLE_BRIDGE=y
CONFIG_JTAG=y
CONFIG_PERSISTENT_STORAGE=y

# WiFi
CONFIG_WIFI=y
CONFIG_APP_WIFI=y
CONFIG_APP_WIFI_PROVISION=y

# ESP32 WiFi driver: disable driver-managed DHCP and auto-reconnect.
# WallaBMC manages DHCP itself (net_init/dhcp.c) — letting the driver also
# manage DHCP causes double-start conflicts that prevent DHCP from completing
# and block the NET_EVENT_WIFI_CONNECT_RESULT event (which the driver gates
# on DHCP completion when AUTO_DHCPV4=y).
# WallaBMC handles reconnect via wifi_auto_reconnect_work_handler() with a
# 5-second delay — the driver's immediate reconnect would race with it.
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=n
CONFIG_ESP32_WIFI_STA_RECONNECT=n

# Debug helpers
CONFIG_NET_SHELL=y
CONFIG_SHELL=y

# Networking adjustments for constrained RAM
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_HTTP_SERVER_MAX_CLIENTS=4

# Redfish system overview (board-specific)
CONFIG_REDFISH_SYSTEM_PRODUCT_NAME="ESP32-C3 DevKitM"
CONFIG_REDFISH_SYSTEM_MANUFACTURER="Espressif"
CONFIG_REDFISH_SYSTEM_MODEL="ESP32-C3 DevKitM"
CONFIG_REDFISH_SYSTEM_PROCESSOR_MODEL="ESP32-C3 RISC-V"
CONFIG_REDFISH_SYSTEM_PROCESSOR_COUNT=1
CONFIG_REDFISH_SYSTEM_MEMORY_GIB=0
